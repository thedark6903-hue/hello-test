name: Build Android APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@7.6.8 @capacitor/cli@7.6.8 @capacitor/android@7.6.8 @capacitor/app@7.1.2

      - name: Check Capacitor version
        run: npx cap --version

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/github-release.keystore
          chmod 600 android/app/github-release.keystore

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Read Android version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$(grep -n "versionCode" android/app/build.gradle | head -1 | sed 's/[^0-9]*//g')
          VERSION_NAME=$(grep -n "versionName" android/app/build.gradle | head -1 | sed 's/.*versionName[[:space:]]*["'\'']\([^"'\'']*\)["'\''].*/\1/')

          echo "Version code: $VERSION_CODE"
          echo "Version name: $VERSION_NAME"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          echo "APK successfully created."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Hello Test v${{ steps.version.outputs.version_name }}
          body: |
            ## Hello Test v${{ steps.version.outputs.version_name }}

            Android APK update.

            - Version code: ${{ steps.version.outputs.version_code }}
            - Version name: ${{ steps.version.outputs.version_name }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          make_latest: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-test-release-apk-v${{ steps.version.outputs.version_name }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Remove signing keystore
        if: always()
        run: |
          rm -f android/app/github-release.keystore
